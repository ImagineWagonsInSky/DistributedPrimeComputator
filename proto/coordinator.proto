syntax = "proto3";

import "google/protobuf/empty.proto";

package app;

service Coordinator {
    // Workers asks for a task, coordinator sends one
    rpc GetWork(GetWorkRequest) returns (WorkResponse) {};
    // Workers submits a prime it found
    rpc SubmitPrimeBatch(SubmitBatchRequest) returns (SubmitBatchResponse) {}; // from worker to cordinator
    // Worker calls this to send its saved state
    rpc SubmitSnapshotChunk(SnapshotChunk) returns (google.protobuf.Empty) {};
    // Heartbeats
    // Bidirectional RPC so we aren't forced to reply at close
    rpc Heartbeat(stream HeartbeatRequest) returns (stream HeartbeatResponse) {};

    // Live job state and a way to rerun the job, for the demo dashboard
    rpc GetStatus(google.protobuf.Empty) returns (CoordinatorStatus) {};
    rpc ResetJob(google.protobuf.Empty) returns (google.protobuf.Empty) {};
}

message WorkResponse {
    // If true, the worker should exit.
    bool no_more_work = 1;
    string task_id = 2;
    string filename = 3;
    uint32 start_line = 4;
    uint32 num_lines = 5;
    string snapshot_id = 6;
}

message SubmitBatchRequest {
    repeated uint64 primes = 1;
    string worker_id = 2;
    string task_id = 3;
}

message SubmitBatchResponse {
    string snapshot_id = 1;
}

message GetWorkRequest {
    string worker_id = 1;
}

message SnapshotChunk {
    string snapshot_id = 1;
    string worker_id = 2;
    // (current task's pickle file) 
    bytes process_state = 3;
}

message HeartbeatRequest {
    string worker_id = 1;
}

message HeartbeatResponse {
}

message WorkerStatus {
    string worker_id = 1;
    int64 ms_since_heartbeat = 2;
    string task_id = 3; // empty when idle
}

message CoordinatorStatus {
    uint32 tasks_queued = 1;
    uint32 tasks_in_progress = 2;
    uint32 tasks_done = 3;
    uint32 primes_found = 4;
    repeated WorkerStatus workers = 5;
    string file_server = 6; // file server the coordinator currently reads from
}