syntax = "proto3";

package fileservice;

service FileService {
  rpc CreateFile(CreateRequest) returns (CreateResponse);
  rpc OpenFile(OpenRequest) returns (OpenResponse);   // will send entire file
  rpc UploadFile(UploadRequest) returns (UploadResponse);   // this is from client to server
  rpc TestAuth(TestAuthRequest) returns (TestAuthResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ListSubdivisionFiles(ListSubdivisionFilesRequest) returns (ListSubdivisionFilesResponse);

  // all in one
  rpc ReplicateFile(ReplicateRequest) returns (UploadResponse);

  // Election/health
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc RequestVote(VoteRequest) returns (VoteResponse);

  rpc CleanupTemp(CleanupTempRequest) returns (CleanupTempResponse);
  rpc CommitFile(CommitRequest) returns (CommitResponse);

  // Leader brings a follower that missed uploads up to date
  rpc GetFileVersions(FileVersionsRequest) returns (FileVersionsResponse);
  rpc InstallFile(InstallFileRequest) returns (InstallFileResponse);
  rpc FinishSync(FinishSyncRequest) returns (FinishSyncResponse);

  // Live internal state, for the demo dashboard
  rpc GetStatus(StatusRequest) returns (ServerStatus);

  //Subdivision files creation and replication
  rpc RequestSubdivisions(RequestDivision) returns (RequestDivisionResponse);
  rpc ReplicateSubdivisions(ReplicateDivision) returns (ReplicateDivisionResponse);
}

message CreateRequest {
  string filename = 1;
  bytes data = 2;
}

message CreateResponse {
  bool success = 1;
  string message = 2;
}

message OpenRequest {
  string filename = 1;
}

message OpenResponse {
  bool success = 1;
  bytes data = 2;
  string message = 3;
  int64 server_timestamp = 4;
  uint64 server_version = 5;
}

message UploadRequest {
  string filename = 1;
  bytes data = 2;
  // should i add a version number
}

message UploadResponse {
  bool success = 1;
  string message = 2;
  string leader_host = 3; // optional for helping client redirect
}

message TestAuthRequest {
  string filename = 1;
  uint64 client_version = 2;
}

message TestAuthResponse {
  bool valid = 1; // true if cache is still good
  string message = 2;
  uint64 server_version = 3;
}

message FileTuple {
  string filename = 1;
  uint64 size = 2;
}

message ListFilesRequest {
  uint32 offset = 1;
  uint32 limit = 2;
}

message ListFilesResponse {
  repeated FileTuple files = 1;
}

//// Alternative to all this
message ReplicateRequest {
  string filename = 1;
  bytes data = 2;
  string request_id = 3;
  // Where this upload sits in the commit sequence, plus the leader's last commit so a
  // follower can apply a commit it missed and tell when it has fallen behind
  uint64 term = 4;
  uint64 index = 5;
  uint64 version = 6;
  uint64 leader_commit_index = 7;
  uint64 leader_commit_term = 8;
}

message HeartbeatRequest {
  string leader_id = 1;
  uint64 term = 2;
  uint64 leader_commit_index = 3;
  uint64 leader_commit_term = 4;
}

message HeartbeatResponse {
  bool ok = 1;
  uint64 term = 2;
  // follower's commit point, so the leader can tell if it needs syncing
  uint64 commit_index = 3;
  uint64 commit_term = 4;
}

message VoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  bool pre_vote = 3; // "would you vote for me?" probe; the voter changes no state
  // candidate's newest upload; voters refuse candidates with less data than themselves
  uint64 last_index = 4;
  uint64 last_term = 5;
}

message VoteResponse {
  bool vote_granted = 1;
  uint64 term = 2;
}

message CleanupTempRequest {
  string filename = 1;
  string request_id = 2;
}

message CleanupTempResponse {
  bool ok = 1;
  string message = 2;
}

message CommitRequest {
  string filename = 1;
  string request_id = 2;
  uint64 version = 3;
  uint64 index = 4;
}

message CommitResponse {
  bool success = 1;
  string message = 2;
}

message RequestDivision {
    uint32 subdivision_size = 1;
}

message RequestDivisionResponse {
    bool success = 1;
}

message ReplicateDivision {
    uint32 subdivision_size = 1;
}

message ReplicateDivisionResponse {
    bool success = 1;
}

message ListSubdivisionFilesRequest {
  uint32 offset = 1;
  uint32 limit = 2;
}

message ListSubdivisionFilesResponse {
  repeated FileTuple files = 1;
}

message FileVersionsRequest {}

message FileVersionsResponse {
  map<string, uint64> versions = 1;
  uint64 commit_index = 2;
  uint64 commit_term = 3;
}

message InstallFileRequest {
  uint64 term = 1;
  string filename = 2;
  bytes data = 3;
  uint64 version = 4;
}

message InstallFileResponse {
  bool success = 1;
  uint64 term = 2;
}

message FinishSyncRequest {
  uint64 term = 1;
  uint64 commit_index = 2;
  uint64 commit_term = 3;
}

message FinishSyncResponse {
  bool success = 1;
  uint64 term = 2;
}

message StatusRequest {}

message ServerStatus {
  string server_id = 1;
  string advertise_addr = 2;
  string role = 3;
  uint64 term = 4;
  string leader = 5;
  string voted_for = 6;
  uint64 commit_index = 7;
  uint64 commit_term = 8;
  bool caught_up = 9;
  int64 ms_since_leader_contact = 10; // -1 if never heard from a leader
  int64 ms_until_election = 11;       // -1 on the leader
  repeated string unreachable_peers = 12; // leader only
}